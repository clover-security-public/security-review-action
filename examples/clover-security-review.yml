# Runs a Clover lean security review on every pull request and posts the results
# as a sticky PR comment. Copy into .github/workflows/clover-security-review.yml.
#
# Setup: create a Clover tenant API token and store it as the secrets below, and
# mark this repository as a design repository in Clover. All inputs (and the UK
# region URLs) are documented in the README.
name: Clover Security Review

on:
  pull_request:
    types: [opened, synchronize]
  # Needed only with recalculation: manual (the re-analyze checkbox):
  # issue_comment:
  #   types: [edited]

permissions:
  contents: read
  pull-requests: write

# A newer push cancels the previous run.
concurrency:
  group: clover-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    # With issue_comment enabled: skip edits on plain issues.
    # if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: clover-security-public/security-review-action@v1
        with:
          client-id: ${{ secrets.CLOVER_CLIENT_ID }}
          secret-key: ${{ secrets.CLOVER_SECRET_KEY }}
          # base-url: https://api-<your-environment>.cloversec.io
          # recalculation: manual
          # max-inline-comments: '10'
          # min-inline-comment-priority: medium
          # max-pending-findings: '0'
          # blocking-priority: high
          # blocking-rules: |
          #   importance >= high, findings >= medium, max 0
          #   findings >= critical, max 0
