name: Clover Security Review
description: >-
  Run a Clover lean security review on a pull request in a design repository and
  post the results as a sticky PR comment, with action items as inline
  comments on the lines they apply to.
author: Clover Security

branding:
  icon: shield
  color: green

inputs:
  client-id:
    description: Client id of a Clover tenant API token. Store it as a repository secret.
    required: true
  secret-key:
    description: Secret key of a Clover tenant API token. Store it as a repository secret.
    required: true
  base-url:
    description: >-
      Base URL of the Clover API for your region or dedicated environment.
      US: https://api.cloversec.io
    required: false
    default: https://api.cloversec.io
  auth-base-url:
    description: >-
      Base URL of the Clover authentication service. Dedicated environments
      usually keep the default. US: https://auth.cloversec.io
    required: false
    default: https://auth.cloversec.io
  url:
    description: >-
      URL of the pull request to review. Defaults to the pull request that
      triggered the workflow.
    required: false
  application-id:
    description: >-
      Clover application id to create the review under. When omitted, the
      application is resolved from the pull request's repository.
    required: false
  wait-timeout:
    description: >-
      Maximum time in seconds to wait for the review to complete before giving
      up (the build is not failed on timeout).
    required: false
    default: '900'
  fail-on-error:
    description: >-
      Whether a failed review creation (e.g. the repository is not marked as a
      design repository in Clover) fails the build. Timeouts never fail the build.
    required: false
    default: 'true'
  recalculation:
    description: >-
      When the pull request is pushed to again: "auto" (default) re-analyzes the
      existing review whenever its design content changed; "manual" only refreshes
      the summary comment and offers a "Re-analyze this pull request" checkbox in
      it — ticking the box triggers the re-analysis (the workflow must also run on
      "issue_comment: [edited]").
    required: false
    default: auto
  max-inline-comments:
    description: >-
      Maximum number of new inline review comments posted per run. Values above
      the server limit (50) are clamped; 0 posts the summary comment only.
    required: false
    default: '10'
  max-pending-findings:
    description: >-
      Fail the workflow run (blocking the pull request when this check is
      required) when the review's pending findings at or above
      "blocking-priority" exceed this number. The results are still posted
      first. Leave empty (the default) to never block. Ignored when
      "blocking-rules" is set.
    required: false
    default: ''
  blocking-priority:
    description: >-
      Lowest finding priority that counts toward "max-pending-findings":
      insignificant, low, medium, high (default) or critical. Ignored when
      "blocking-rules" is set.
    required: false
    default: high
  blocking-rules:
    description: >-
      Blocking policy combining the review's importance with finding
      thresholds; replaces max-pending-findings/blocking-priority when set.
      One rule per line, comma-separated clauses: "importance >= <priority>"
      (gates the rule on the review's importance; omitted = every review),
      "findings >= <priority>" (lowest finding priority counted; omitted =
      every priority) and "max <count>" (required). The run fails when any
      rule is exceeded. Example — "importance >= high, findings >= medium,
      max 0" plus a second line "findings >= critical, max 0".
    required: false
    default: ''
  min-inline-comment-priority:
    description: >-
      Lowest finding priority that gets an inline review comment; findings
      below it appear only in the summary comment. One of insignificant, low,
      medium, high or critical. Empty (the default) posts inline comments for
      every priority.
    required: false
    default: ''
  github-token:
    description: Token used to write the sticky PR comment and inline review comments.
    required: false
    default: ${{ github.token }}

outputs:
  security-review-id:
    description: Id of the created (or pre-existing) Clover security review.
  status:
    description: >-
      Outcome of the run: completed, blocked (pending findings exceeded
      "max-pending-findings"), timeout, failed, unsupported-repository or
      skipped (a comment edit that was not a re-analyze request).
  comment-url:
    description: URL of the sticky PR comment, when one was written.
  inline-comments:
    description: Number of action items posted as inline review comments on the diff.
  pending-findings:
    description: Total number of the review's pending findings, across all priorities.
  blocking-findings:
    description: Number of pending findings at or above "blocking-priority".
  review-importance:
    description: >-
      The review's importance (the value the Clover public API exposes as the
      security review's importance), lowercased.

runs:
  using: node24
  main: src/main.js
